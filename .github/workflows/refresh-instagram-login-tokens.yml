name: Refresh Instagram Login tokens

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # Weekly, Monday 7am UTC — well inside the 10-day refresh window

jobs:
  refresh-instagram-login-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh tokens
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-instagram-login-tokens.mjs
